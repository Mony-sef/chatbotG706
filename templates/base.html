<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EQUIVATIA | Democratizando la Energía Renovable{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    {% block head %}{% endblock %}    
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="EQUIVATIA" style="width: 250px;" transparent 50% class="rounded-circle border border-4 img-fluid">
    
    <h1>🌱 EQUIVATIA</h1>
    <ul>
      <li><a href="/">Inicio</a></li>
      <li><a href="/energia">Energías</a></li>
      <li><a href="/beneficios">Beneficios</a></li>
      <li><a href="/mapa">Mapa</a></li>
      <li><a href="/contacto">Contacto</a></li>
    </ul>
  </nav>

  <!-- CONTENIDO DINÁMICO -->
  {% block content %}
  {% endblock %}

  <!-- BOTÓN CHAT -->
  <button id="chat-toggle" class="chat-toggle">💬</button>

  <!-- CHAT -->
  <div id="chat-wrapper" class="chat-wrapper">
    <div class="chat-header">
      <span>🤖 Chatbot</span>
      <button id="chat-close">✖</button>
    </div>

    <div id="chatbox">
      <div id="messages"></div>
      <form id="chatForm">
        <input
          type="text"
          id="userInput"
          placeholder="Escribe tu mensaje..."
          autocomplete="off"
        />
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>

  <script>
    const chatToggle = document.getElementById("chat-toggle");
    const chatWrapper = document.getElementById("chat-wrapper");
    const chatClose = document.getElementById("chat-close");

    chatToggle.addEventListener("click", () => {
      chatWrapper.style.display = "flex";
    });

    chatClose.addEventListener("click", () => {
      chatWrapper.style.display = "none";
    });
  </script>

</body>
</html>
